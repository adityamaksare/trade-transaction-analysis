version: '3.8'

# Backend-only Docker setup
# Run frontend locally with: cd frontend && npm start

services:
  # ZooKeeper - Required for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: fraud-detection-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - fraud-detection-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka - Message Queue
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fraud-detection-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - fraud-detection-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # MongoDB - Database
  mongodb:
    image: mongo:latest
    container_name: fraud-detection-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - fraud-detection-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend - Flask App + Consumer
  # Uses host.docker.internal to connect to your Mac's Ollama
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fraud-detection-backend
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    ports:
      - "5001:5000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: transactions
      KAFKA_DLQ_TOPIC: transactions_dlq
      KAFKA_GROUP_ID: fraud-detector-group
      SPARK_KAFKA_OFFSET: latest  # Only process NEW messages, not historical
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: fraud_detection
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3:8b
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      FLASK_DEBUG: "False"
      CORS_ALLOWED_ORIGINS: "*"
      MAX_RETRIES: 3
      RETRY_BACKOFF_BASE: 2.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fraud-detection-network
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Producer - Transaction Generator
  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: fraud-detection-producer
    depends_on:
      kafka:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: transactions
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: fraud_detection
    networks:
      - fraud-detection-network
    restart: on-failure

networks:
  fraud-detection-network:
    driver: bridge

volumes:
  mongodb-data:
    driver: local